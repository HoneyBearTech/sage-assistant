# gitleaks settings for `npm run secret-scan`: the default rules, without the folders that hold
# downloaded or generated files.
[extend]
useDefault = true

[allowlist]
description = "Installed packages, build output and packaged apps"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)out/''',
  '''(^|/)coverage/''',
  '''(^|/)\.git/''',
]
